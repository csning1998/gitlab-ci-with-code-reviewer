---
defaults:
  max_tokens: 16384
  timeout: 10m
  # temperature: 0.2
  # top_p: 0.95

models:
  # Anthropic Claude configuration (Claude 4.x / 5.x)
  claude-sonnet-5.5:
    provider: claude
    model: claude-sonnet-5.5
    web_search: true
    thinking_type: adaptive
    max_tokens: 128000
    reasoning_level: high
    prompt_file: .gitlab/code_review_guidelines/generic_rules.md

  claude-sonnet-5:
    provider: claude
    model: claude-sonnet-5
    thinking_type: adaptive
    reasoning_level: high
    prompt_file: .gitlab/code_review_guidelines/generic_rules.md
    # Optional tuning parameters:
    # max_tokens: 16384
    # timeout: 10m
    # (Legacy models only: thinking_budget: 4096)

  # Google Gemini configuration (Gemini 3.x / 4.x)
  gemini-4-argon:
    provider: gemini
    model: gemini-4-argon
    google_search: true
    max_tokens: 65536
    reasoning_level: high
    prompt_file: .gitlab/code_review_guidelines/generic_rules.md

  gemini-3.8-flash:
    provider: gemini
    model: gemini-3.8-flash
    google_search: true
    temperature: 0.0
    max_tokens: 65536
    reasoning_level: high
    prompt_file: .gitlab/code_review_guidelines/generic_rules.md
    # Optional tuning parameters:
    # top_p: 0.95
    # top_k: 40

  # OpenAI configuration example (GPT-6 series / o-series reasoning models)
  # openai-gpt-6-sol:
  #   provider: openai
  #   model: gpt-6-sol
  #   reasoning_level: high
  #   prompt_file: .gitlab/code_review_guidelines/generic_rules.md
  #   # Optional tuning parameters:
  #   # max_tokens: 16384
  #   # temperature: 0.2
  #   # top_p: 1.0
  #   # frequency_penalty: 0.0
  #   # presence_penalty: 0.0
  #   # seed: 42

  # Azure OpenAI configuration example
  # azure-gpt-5.4-mini:
  #   provider: azure-openai
  #   model: gpt-5.4-mini
  #   prompt_file: .gitlab/code_review_guidelines/generic_rules.md
  #   # Optional tuning parameters:
  #   # max_tokens: 32768
  #   # (Requires REVIEW_BASE_URL and REVIEW_API_VERSION provided via CI/CD inputs or environment variables)

  # xAI Grok configuration example (Grok 4.x flagship series)
  # grok-4-7:
  #   provider: grok
  #   model: grok-4.7
  #   reasoning_level: high
  #   temperature: 0.0
  #   prompt_file: .gitlab/code_review_guidelines/generic_rules.md
  #   # Optional tuning parameters:
  #   # max_tokens: 16384
  #   # top_p: 0.95

  # Local OpenAI-compatible server configuration example (vLLM / Ollama / SGLang / llama.cpp)
  # local-qwen3-coder:
  #   provider: local
  #   model: Qwen/Qwen3-Coder-Next-Instruct
  #   temperature: 0.1
  #   prompt_file: .gitlab/code_review_guidelines/generic_rules.md
  #   # Optional tuning parameters:
  #   # max_tokens: 8192
  #   # top_p: 0.9
  #   # repetition_penalty: 1.05
  #   # min_p: 0.05
  #   # (Requires REVIEW_BASE_URL provided via CI/CD variables, e.g., http://vllm-host:8000/v1)

slots:
  primary: claude-sonnet-5.5
  fast: gemini-3.8-flash
  # balanced: openai-gpt-6-sol
  # enterprise: azure-gpt-5.4-mini
  # grok: grok-4-7
  # onprem: local-qwen3-coder
