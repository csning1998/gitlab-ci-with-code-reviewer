---
services:
  gitlab-runner:
    image: docker.io/gitlab/gitlab-runner:v19.0.1
    container_name: gitlab-runner-gitlab-ci-with-code-reviewer
    network_mode: "host"
    restart: always
    # Reaching the rootless podman socket requires the connectto permission that the
    # gitlab_runner_podman policy module grants exclusively to this SELinux type.
    security_opt:
      - label=type:container_engine_t
    volumes:
      - ./runner-config:/etc/gitlab-runner
      - /run/user/${HOST_UID}/podman/podman.sock:/run/podman/podman.sock
