---
spec:
  inputs:
    module_dir:
      default: '$CI_PROJECT_DIR'
      description: >-
        Directory containing the target Terraform module. Specify a subdirectory for monorepo layouts.

    module_name:
      default: '$CI_PROJECT_NAME'
      description: 'Terraform Module Registry module name.'
      regex: '^\$[A-Z_][A-Z0-9_]*$|^[a-zA-Z0-9_-]+$'
    module_system:
      default: 'local'
      description: 'Terraform Module Registry system (provider) identifier, e.g. gitlab.'
    curl_image:
      default: 'curlimages/curl:8.10.1'
      description: 'curl image for the registry upload job.'
    tag_prefix:
      description: >-
        Literal prefix matched against CI_COMMIT_TAG. Omits default values to prevent unexpanded
        $[[ inputs.module_name ]] tokens from evaluating literally in rule condition interpolations.
---
# Embeds module_name in job identifiers to isolate registry uploads and prevent job name collisions across components.
deploy:terraform-module-$[[ inputs.module_name ]]:
  stage: deploy
  image: '$[[ inputs.curl_image ]]'
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.tag_prefix ]]/'
  script:
    - MODULE_NAME=$(echo "$[[ inputs.module_name ]]" | tr " _" -)
    - MODULE_VERSION="${CI_COMMIT_TAG#$[[ inputs.tag_prefix ]]}"
    - |
      if ! [[ "${MODULE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        echo "Error: MODULE_VERSION '${MODULE_VERSION}' is not valid semver." >&2
        echo "CI_COMMIT_TAG '${CI_COMMIT_TAG}', tag_prefix '$[[ inputs.tag_prefix ]]'." >&2
        exit 1
      fi
    - TAR_FILENAME="/tmp/${MODULE_NAME}-$[[ inputs.module_system ]]-${MODULE_VERSION}.tgz"
    - |
      UPLOAD_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/terraform/modules/${MODULE_NAME}\
      /$[[ inputs.module_system ]]/${MODULE_VERSION}/file"
    - |
      tar -vczf "${TAR_FILENAME}" -C "$[[ inputs.module_dir ]]" \
      --exclude=./.git --exclude=./.terraform --exclude='*.tfstate*' --exclude='*.tfvars' .
    - |
      curl --fail-with-body --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file "${TAR_FILENAME}" "${UPLOAD_URL}"
