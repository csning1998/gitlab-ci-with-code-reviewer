---
spec:
  inputs:
    reviewer_image:
      description: 'Required; prebuilt reviewer image providing the auto-tag binary.'
    stage:
      default: 'deploy'
      description: >-
        Pipeline stage running this job. The default matches core.yml's stage list; override
        this when the including project declares its own stages without a deploy entry.
    config_path:
      default: '.gitlab/versioning.yml'
      description: >-
        Path, relative to the repository root, to the versioning configuration declaring the
        modules this job tags. See tools/ci/internal/versiontag for the file's schema; a module
        with an empty name and dir "." reproduces single, whole-repository tagging.
---
# Calculates and creates Semantic Version tags from Conventional Commit headers on squash merges.
# Remote tag creation executes via the GitLab REST API to ensure tag pipeline execution
# (gitlab-org/gitlab#569187). Requires TAG_PUSH_TOKEN with the "api" scope.
auto-tag:
  stage: '$[[ inputs.stage ]]'
  image: '$[[ inputs.reviewer_image ]]'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: '0'
  script:
    - |
      auto-tag --sha "$CI_COMMIT_SHA" --config "$[[ inputs.config_path ]]" \
        --api-url "$CI_API_V4_URL" --project-id "$CI_PROJECT_ID"

# Validates TAG_PUSH_TOKEN api scope in MR pipelines to detect credential misconfigurations prior to merge.
auto-tag:verify-token:
  stage: '$[[ inputs.stage ]]'
  image: '$[[ inputs.reviewer_image ]]'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - verify-tag-token --api-url "$CI_API_V4_URL"
