---
spec:
  inputs:
    terraform_image:
      default: 'hashicorp/terraform:1.15'
      description: 'Terraform image for the fmt job.'
    checkov_image:
      default: 'bridgecrew/checkov:3.3.0'
      description: 'Checkov image for the terraform-framework scan.'
    checkov_dir:
      default: 'terraform/'
      description: 'Directory Checkov scans with --framework terraform.'
    checkov_skip:
      default: 'CKV_GIT_1,CKV_GLB_1,CKV_GLB_3,CKV_GLB_4'
      description: 'Comma-separated check IDs to skip; tune per project.'
---
# Disables job cancellation on new commits to guarantee completion of automated formatting push operations.
terraform-fmt:
  stage: format
  image:
    name: '$[[ inputs.terraform_image ]]'
    entrypoint: ['']
  interruptible: false
  needs:
    - job: prepare-fmt-commit-pusher
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - terraform fmt -recursive
    - |
      ./fmt-commit-pusher --message "style: terraform fmt" \
        --remote-url "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

checkov-terraform:
  stage: lint
  image:
    name: '$[[ inputs.checkov_image ]]'
    entrypoint: ['']
  needs: []
  interruptible: true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - '**/*.tf'
        - '**/*.hcl'
        - '**/*.tfvars'
        - '**/*.tofu'
  script:
    - checkov --directory $[[ inputs.checkov_dir ]] --framework terraform --compact --quiet
      --skip-check $[[ inputs.checkov_skip ]]
