---
spec:
  inputs:
    bun_image:
      default: 'oven/bun:1-alpine'
      description: 'Bun image for prettier and the TypeScript type check.'
    ts_globs:
      type: array
      default: ['frontend/**/*', 'backend/**/*', 'contracts/**/*']
      description: 'rules:changes globs gating the fmt, type check, and test jobs.'
    frontend_dir:
      default: 'frontend'
      description: 'Vue/frontend directory; checked with vue-tsc.'
    backend_dir:
      default: 'backend'
      description: 'Backend directory; checked with tsc --noEmit.'
---
# Disables job cancellation on new commits to guarantee completion of automated formatting push operations.
fmt:typescript:
  stage: format
  image: '$[[ inputs.bun_image ]]'
  interruptible: false
  needs:
    - job: fmt:prepare-pusher
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.ts_globs ]]
  before_script:
    - bun install
  script:
    - bunx prettier --write .
    - |
      ./fmt-commit-pusher --message "style: prettier fmt" \
        --remote-url "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

# Frontend and backend checks run as parallel jobs to ensure type errors
# across both targets surface in a single pipeline run.
test:typescript:
  stage: test
  image: '$[[ inputs.bun_image ]]'
  interruptible: true
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules/
  needs:
    - job: lint:typescript-frontend
      optional: true
    - job: lint:typescript-backend
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.ts_globs ]]
  script:
    - bun install --frozen-lockfile
    - bun run --filter '*' test

lint:typescript-frontend:
  stage: lint
  image: '$[[ inputs.bun_image ]]'
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.ts_globs ]]
  script:
    - cd $[[ inputs.frontend_dir ]]
    - bun install
    - bunx vue-tsc --noEmit

lint:typescript-backend:
  stage: lint
  image: '$[[ inputs.bun_image ]]'
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.ts_globs ]]
  script:
    - cd $[[ inputs.backend_dir ]]
    - bun install
    - bunx tsc --noEmit
