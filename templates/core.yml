---
spec:
  inputs:
    reviewer_image:
      description: 'Required; prebuilt reviewer image pinned to a version (no default, no floating tag).'
    claude_model:
      default: ''
      description: 'Claude model id for the Claude reviewer. Leave empty to disable the job.'
    gemini_model:
      default: ''
      description: 'Gemini model id for the Gemini reviewer, including Gemma. Leave empty to disable the job.'
    markdownlint_image:
      default: 'markdownlint/markdownlint:0.17.0'
      description: 'Ruby mdl image for Markdown linting.'
    yamllint_image:
      default: 'pipelinecomponents/yamllint:0.35.12'
      description: 'yamllint image for YAML linting.'
    max_description_chars:
      type: number
      default: 5000
      description: 'Max MR description length sent to the reviewer; the pipeline fails if exceeded.'
    claude_max_tokens:
      type: number
      default: 16384
      description: >-
        Max output tokens for the Claude Messages API request; raise this if large diffs
        truncate the JSON response.
    claude_timeout_minutes:
      type: number
      default: 10
      description: >-
        Timeout, in minutes, for the Claude Messages API request; raise this if large diffs
        exceed the deadline before the response completes.
    enable_commitlint:
      type: boolean
      default: true
      description: >-
        Enforces Conventional Commit format validation across the Merge Request commit range.
        Disabling this setting is recommended for repositories lacking a dedicated Continuous Integration pipeline.
    gitleaks_image:
      default: 'docker.io/zricethezav/gitleaks:v8.30.1'
      description: 'gitleaks image for Merge Request diff-range secret detection.'
    enable_sonarqube:
      type: boolean
      default: false
      description: >-
        Runs a SonarQube Scanner CLI analysis against the self-hosted SonarQube instance.
        This requires SONAR_HOST_URL and SONAR_TOKEN to be available as CI/CD variables.
    sonar_scanner_image:
      default: 'docker.io/sonarsource/sonar-scanner-cli:12.1.0.3225_8.0.1'
      description: 'sonar-scanner-cli image for the SonarQube analysis job.'
    sonar_scanner_tags:
      type: array
      default: []
      description: >-
        Runner tags required to schedule security:sonarqube onto a runner with network access
        to the SonarQube instance. Leave empty when the default runner already has that access.
    sonar_go_coverage_path:
      default: ''
      description: >-
        Path to a go test -coverprofile report, relative to the repository root. Leave empty
        when no Go coverage report exists; the corresponding sonar-scanner property is omitted.
---
# Defines core pipeline stages and workflow auto-cancellation rules for downstream language components.
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - format
  - build
  - lint
  - security
  - test
  - review
  - deploy

# Exports fmt-commit-pusher binary from reviewer_image as a build artifact.
# Tool-specific format jobs lack this binary and retrieve it via stage artifact dependencies.
fmt:prepare-pusher:
  stage: format
  image: '$[[ inputs.reviewer_image ]]'
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cp /usr/local/bin/fmt-commit-pusher .
  artifacts:
    paths:
      - fmt-commit-pusher
    expire_in: 1 hour

# Enforces maximum merge request description character limits prior to LLM review invocation.
misc:mr-gate:
  stage: lint
  image: '$[[ inputs.reviewer_image ]]'
  interruptible: true
  variables:
    MAX_DESCRIPTION_CHARS: '$[[ inputs.max_description_chars ]]'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - mr-gate

# Applies deterministic classification labels (type::*, breaking-change, area::*)
# independently of manual LLM review execution.
misc:mr-labeler:
  stage: lint
  image: '$[[ inputs.reviewer_image ]]'
  interruptible: true
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - mr-labeler

lint:commit:
  stage: lint
  image: '$[[ inputs.reviewer_image ]]'
  interruptible: true
  needs: []
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $[[ inputs.enable_commitlint ]]'
  script:
    - |
      commitlint --config /etc/commitlint/commitlint.config.cjs \
      --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA"

security:gitleaks:
  stage: security
  image:
    name: '$[[ inputs.gitleaks_image ]]'
    entrypoint: ['']
  needs: []
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - gitleaks detect --log-opts="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA" --redact -v

security:sonarqube:
  stage: security
  image:
    name: '$[[ inputs.sonar_scanner_image ]]'
    entrypoint: ['']
  needs:
    - job: test:go
      optional: true
  interruptible: true
  allow_failure: true
  variables:
    GIT_DEPTH: '0'
  tags: $[[ inputs.sonar_scanner_tags ]]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $[[ inputs.enable_sonarqube ]]'
  script:
    - |
      GO_COVERAGE_ARG=""
      if [ -n "$[[ inputs.sonar_go_coverage_path ]]" ] && [ -f "$[[ inputs.sonar_go_coverage_path ]]" ]; then
        GO_COVERAGE_ARG="-Dsonar.go.coverage.reportPaths=$[[ inputs.sonar_go_coverage_path ]]"
      fi
      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY:-$CI_PROJECT_PATH_SLUG}" \
        -Dsonar.qualitygate.wait=true \
        -Dsonar.tests=. \
        -Dsonar.test.inclusions="**/*_test.go" \
        $GO_COVERAGE_ARG

lint:markdown:
  stage: lint
  image:
    name: '$[[ inputs.markdownlint_image ]]'
    entrypoint: ['']
  allow_failure: true
  needs: []
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - '**/*.md'
  script:
    - mdl .

lint:yaml:
  stage: lint
  image: '$[[ inputs.yamllint_image ]]'
  needs: []
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - '**/*.yml'
        - '**/*.yaml'
  script:
    - yamllint .

# Omits explicit job dependencies (`needs`) to preserve compatibility across optional language component inclusions.
review:claude-code:
  stage: review
  image: '$[[ inputs.reviewer_image ]]'
  variables:
    CLAUDE_MODEL: '$[[ inputs.claude_model ]]'
    MAX_DESCRIPTION_CHARS: '$[[ inputs.max_description_chars ]]'
    CLAUDE_MAX_TOKENS: '$[[ inputs.claude_max_tokens ]]'
    CLAUDE_TIMEOUT_MINUTES: '$[[ inputs.claude_timeout_minutes ]]'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CLAUDE_MODEL != ""'
      when: manual
      allow_failure: true
  interruptible: true
  script:
    - claude-review

review:gemini-code:
  stage: review
  image: '$[[ inputs.reviewer_image ]]'
  variables:
    GEMINI_MODEL: '$[[ inputs.gemini_model ]]'
    MAX_DESCRIPTION_CHARS: '$[[ inputs.max_description_chars ]]'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GEMINI_MODEL != ""'
      when: manual
      allow_failure: true
  interruptible: true
  script:
    - gemini-review
