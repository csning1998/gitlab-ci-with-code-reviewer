---
spec:
  inputs:
    reviewer_image:
      description: 'Required; prebuilt reviewer image pinned to a version (no default, no floating tag).'
    review_models:
      type: array
      default: []
      description: >-
        Model ids or reviewer.yml keys. Each entry becomes one manual review job. The provider
        is derived from each entry against the compile-time allowlist. An empty list emits no
        review job at all.
    review_config_file:
      default: ''
      description: >-
        Path to the reviewer declaration carrying per-model parameters.
        Defaults to .gitlab/reviewer.yml when left empty.
    review_vault_addr:
      default: ''
      description: >-
        Vault address. A non-empty value selects Workload Identity Federation and removes the
        static provider API key requirement.
    review_vault_audience:
      default: 'vault'
      description: >-
        Audience claim of the requested CI identity token. The value MUST match the
        bound_audiences of the Vault JWT auth role when that role binds an audience.
    review_vault_auth_mount:
      default: 'gitlab-saas-jwt'
      description: 'Vault JWT auth backend mount path.'
    review_vault_role:
      default: ''
      description: 'Vault JWT auth role name. Required when review_vault_addr is set.'
    review_vault_kv_mount:
      default: 'secret'
      description: 'Vault KV-v2 engine mount path.'
    review_vault_secret_path:
      default: ''
      description: >-
        Vault KV-v2 secret path holding one field per provider, for example claude_api_key.
        Required when review_vault_addr is set.
    review_base_url:
      default: ''
      description: >-
        Endpoint override. Required for Azure OpenAI and for a local inference server.
        Leave empty for the vendor default endpoint.
    review_api_version:
      default: ''
      description: >-
        Azure OpenAI api-version. A non-empty value routes an OpenAI model id to Azure OpenAI
        and selects the deployment request shape.
    markdownlint_image:
      default: 'markdownlint/markdownlint:0.17.0'
      description: 'Ruby mdl image for Markdown linting.'
    yamllint_image:
      default: 'pipelinecomponents/yamllint:0.35.12'
      description: 'yamllint image for YAML linting.'
    max_description_chars:
      type: number
      default: 5000
      description: 'Max MR description length sent to the reviewer; the pipeline fails if exceeded.'
    review_max_tokens:
      type: number
      default: 16384
      description: >-
        Max output tokens for the provider request. Raise this value when large diffs
        truncate the JSON response.
    review_timeout_minutes:
      type: number
      default: 10
      description: >-
        Timeout, in minutes, for the provider request. Raise this value when large diffs
        exceed the deadline before the response completes.
    enable_commitlint:
      type: boolean
      default: true
      description: >-
        Enforces Conventional Commit format validation across the Merge Request commit range.
        Disabling this setting is recommended for repositories lacking a dedicated Continuous Integration pipeline.
    gitleaks_image:
      default: 'docker.io/zricethezav/gitleaks:v8.30.1'
      description: 'gitleaks image for Merge Request diff-range secret detection.'
    enable_sonarqube:
      type: boolean
      default: false
      description: >-
        Runs a SonarQube Scanner CLI analysis against the self-hosted SonarQube instance.
        This requires SONAR_HOST_URL and SONAR_TOKEN to be available as CI/CD variables.
    sonar_scanner_image:
      default: 'docker.io/sonarsource/sonar-scanner-cli:12.1.0.3225_8.0.1'
      description: 'sonar-scanner-cli image for the SonarQube analysis job.'
    sonar_scanner_tags:
      type: array
      default: []
      description: >-
        Runner tags required to schedule security:sonarqube onto a runner with network access
        to the SonarQube instance. Leave empty when the default runner already has that access.
    sonar_go_coverage_path:
      default: ''
      description: >-
        Path to a go test -coverprofile report, relative to the repository root. Leave empty
        when no Go coverage report exists; the corresponding sonar-scanner property is omitted.
---
# Defines core pipeline stages and workflow auto-cancellation rules for downstream language components.
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - format
  - build
  - lint
  - test
  - security
  - review
  - deploy

# Exports fmt-commit-pusher binary from reviewer_image as a build artifact.
# Tool-specific format jobs lack this binary and retrieve the binary via stage artifact dependencies.
fmt:prepare-pusher:
  stage: format
  image: '$[[ inputs.reviewer_image ]]'
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cp /usr/local/bin/fmt-commit-pusher .
  artifacts:
    paths:
      - fmt-commit-pusher
    expire_in: 1 hour

# Enforces maximum merge request description character limits prior to LLM review invocation.
misc:mr-gate:
  stage: lint
  image: '$[[ inputs.reviewer_image ]]'
  interruptible: true
  needs:
    - job: fmt:prepare-pusher
      optional: true
  variables:
    MAX_DESCRIPTION_CHARS: '$[[ inputs.max_description_chars ]]'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - mr-gate

# Applies deterministic classification labels (type::*, breaking-change, area::*)
# independently of manual LLM review execution.
misc:mr-labeler:
  stage: lint
  image: '$[[ inputs.reviewer_image ]]'
  interruptible: true
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - mr-labeler

lint:commit:
  stage: lint
  image: '$[[ inputs.reviewer_image ]]'
  interruptible: true
  needs:
    - job: fmt:prepare-pusher
      optional: true
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $[[ inputs.enable_commitlint ]]'
  script:
    - |
      commitlint --config /etc/commitlint/commitlint.config.cjs \
      --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA"

security:gitleaks:
  stage: security
  image:
    name: '$[[ inputs.gitleaks_image ]]'
    entrypoint: ['']
  needs: []
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - gitleaks detect --log-opts="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA" --redact -v

security:sonarqube:
  stage: security
  image:
    name: '$[[ inputs.sonar_scanner_image ]]'
    entrypoint: ['']
  needs:
    - job: test:go
      optional: true
  interruptible: true
  allow_failure: true
  variables:
    GIT_DEPTH: '0'
  tags: $[[ inputs.sonar_scanner_tags ]]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $[[ inputs.enable_sonarqube ]]'
  script:
    - |
      GO_COVERAGE_ARG=""
      if [ -n "$[[ inputs.sonar_go_coverage_path ]]" ] && [ -f "$[[ inputs.sonar_go_coverage_path ]]" ]; then
        GO_COVERAGE_ARG="-Dsonar.go.coverage.reportPaths=$[[ inputs.sonar_go_coverage_path ]]"
      fi
      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY:-$CI_PROJECT_PATH_SLUG}" \
        -Dsonar.qualitygate.wait=true \
        -Dsonar.tests=. \
        -Dsonar.test.inclusions="**/*_test.go" \
        $GO_COVERAGE_ARG

lint:markdown:
  stage: lint
  image:
    name: '$[[ inputs.markdownlint_image ]]'
    entrypoint: ['']
  allow_failure: true
  needs:
    - job: fmt:prepare-pusher
      optional: true
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - '**/*.md'
  script:
    - mdl .

lint:yaml:
  stage: lint
  image: '$[[ inputs.yamllint_image ]]'
  needs:
    - job: fmt:prepare-pusher
      optional: true
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - '**/*.yml'
        - '**/*.yaml'
  script:
    - yamllint .

# Omits explicit job dependencies (`needs`) to preserve compatibility across optional language component inclusions.
review:code:
  stage: review
  image: '$[[ inputs.reviewer_image ]]'
  id_tokens:
    VAULT_ID_TOKEN:
      aud: '$[[ inputs.review_vault_audience ]]'
  parallel:
    matrix:
      - REVIEW_MODEL: $[[ inputs.review_models ]]
  variables:
    REVIEW_BASE_URL: '$[[ inputs.review_base_url ]]'
    REVIEW_API_VERSION: '$[[ inputs.review_api_version ]]'
    REVIEW_MAX_TOKENS: '$[[ inputs.review_max_tokens ]]'
    REVIEW_TIMEOUT_MINUTES: '$[[ inputs.review_timeout_minutes ]]'
    REVIEW_CONFIG_FILE: '$[[ inputs.review_config_file ]]'
    MAX_DESCRIPTION_CHARS: '$[[ inputs.max_description_chars ]]'
    VAULT_ADDR: '$[[ inputs.review_vault_addr ]]'
    VAULT_AUTH_MOUNT: '$[[ inputs.review_vault_auth_mount ]]'
    VAULT_ROLE: '$[[ inputs.review_vault_role ]]'
    VAULT_KV_MOUNT: '$[[ inputs.review_vault_kv_mount ]]'
    VAULT_SECRET_PATH: '$[[ inputs.review_vault_secret_path ]]'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  interruptible: true
  script:
    - review
