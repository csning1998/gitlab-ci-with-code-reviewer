---
spec:
  inputs:
    packer_image:
      default: 'hashicorp/packer:1.15'
      description: 'Packer image for the fmt job.'
    packer_dir:
      default: 'packer/'
      description: 'Directory packer fmt rewrites recursively.'
    packer_globs:
      type: array
      default: ['packer/**/*.hcl']
      description: 'rules:changes globs gating the fmt job.'
---
# Disables job cancellation on new commits to guarantee completion of automated formatting push operations.
fmt:packer:
  stage: format
  image:
    name: '$[[ inputs.packer_image ]]'
    entrypoint: ['']
  interruptible: false
  needs:
    - job: fmt:prepare-pusher
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.packer_globs ]]
  script:
    - packer fmt -recursive $[[ inputs.packer_dir ]]
    - |
      ./fmt-commit-pusher --message "style: packer fmt" \
        --remote-url "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
