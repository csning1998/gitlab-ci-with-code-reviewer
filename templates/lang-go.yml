---
spec:
  inputs:
    go_image:
      default: 'golang:1.26-alpine'
      description: 'Go toolchain image for fmt and build.'
    golangci_image:
      default: 'golangci/golangci-lint:v2.12.2-alpine'
      description: 'golangci-lint image for the lint job.'
    go_dir:
      default: 'tools/ci'
      description: 'Directory containing the Go module to build and lint.'
    go_fmt_path:
      default: './tools'
      description: 'Path gofmt rewrites, relative to repo root.'
    go_globs:
      type: array
      default: ['tools/**/*.go', 'tools/**/go.mod', 'tools/**/go.sum']
      description: 'rules:changes globs gating all Go jobs.'
    golangci_config:
      default: '../../.gitlab/golangci.yml'
      description: 'golangci config path, relative to go_dir.'
---
# Disables job cancellation on new commits to guarantee completion of automated formatting push operations.
fmt:go:
  stage: format
  image: '$[[ inputs.go_image ]]'
  interruptible: false
  needs:
    - job: fmt:prepare-pusher
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.go_globs ]]
  script:
    - gofmt -w $[[ inputs.go_fmt_path ]]
    - |
      ./fmt-commit-pusher --message "style: gofmt" \
        --remote-url "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

build:go:
  stage: build
  image: '$[[ inputs.go_image ]]'
  needs:
    - job: fmt:go
      optional: true
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.go_globs ]]
  script:
    - cd $[[ inputs.go_dir ]]
    - go build ./...

test:go:
  stage: build
  image: '$[[ inputs.go_image ]]'
  needs:
    - job: build:go
      optional: true
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.go_globs ]]
  before_script:
    - apk add --no-cache git
  script:
    - cd $[[ inputs.go_dir ]]
    - go test -coverprofile=coverage.out ./...
  artifacts:
    paths:
      - $[[ inputs.go_dir ]]/coverage.out
    expire_in: 1 day

lint:go:
  stage: lint
  image: '$[[ inputs.golangci_image ]]'
  needs:
    - job: build:go
      optional: true
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.go_globs ]]
  script:
    - cd $[[ inputs.go_dir ]]
    - golangci-lint run -c $[[ inputs.golangci_config ]] ./...
