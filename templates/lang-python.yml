---
spec:
  inputs:
    package_manager:
      default: 'pip'
      options: ['pip', 'uv']
      description: 'Package manager to use: pip or uv.'
    python_image:
      default: 'python:3.11-alpine'
      description: 'Python image. For uv, use ghcr.io/astral-sh/uv:alpine.'
    python_globs:
      type: array
      default: ['**/*.py']
      description: 'Rules:changes globs gating python check and test jobs.'
    python_test_cmd:
      default: 'pytest'
      description: 'Command to run Python tests.'
    test_stage:
      default: 'test'
      description: 'Stage for the test:python job.'
---
# Consuming pipelines must declare stages corresponding to the stages utilized by this component.

# Base template configuration for Python pipeline jobs.
.python-base:
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.python_globs ]]

fmt:python:
  extends: .python-base
  stage: format
  image: '$[[ inputs.python_image ]]'
  interruptible: false # Disables job cancellation on new commits to guarantee completion of git push operations.
  needs:
    - job: fmt:prepare-pusher
      artifacts: true
  before_script:
    - |
      if [ "$[[ inputs.package_manager ]]" = "uv" ]; then
        if ! command -v uv >/dev/null 2>&1; then
          pip install uv
        fi
      else
        pip install ruff
      fi
  script:
    - |
      if [ "$[[ inputs.package_manager ]]" = "uv" ]; then
        uvx ruff format .
        uvx ruff check --fix . || true
      else
        ruff format .
        ruff check --fix . || true
      fi
    - |
      ./fmt-commit-pusher --message "style: ruff format and autofix" \
        --remote-url "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

lint:python:
  extends: .python-base
  stage: lint
  image: '$[[ inputs.python_image ]]'
  before_script:
    - |
      if [ "$[[ inputs.package_manager ]]" = "uv" ]; then
        if ! command -v uv >/dev/null 2>&1; then
          pip install uv
        fi
      else
        pip install ruff
      fi
  script:
    - |
      if [ "$[[ inputs.package_manager ]]" = "uv" ]; then
        uvx ruff check .
      else
        ruff check .
      fi

test:python:
  extends: .python-base
  stage: '$[[ inputs.test_stage ]]'
  image: '$[[ inputs.python_image ]]'
  # Extends pipeline execution to default branch and tag pushes to verify post-merge integration stability.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.python_globs ]]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - |
      if [ "$[[ inputs.package_manager ]]" = "uv" ]; then
        if ! command -v uv >/dev/null 2>&1; then
          pip install uv
        fi
        if [ -f "pyproject.toml" ]; then
          uv pip install . --system
        elif [ -f "requirements.txt" ]; then
          uv pip install -r requirements.txt --system
        fi
        uv pip install pytest pytest-asyncio httpx requests pydantic --system
      else
        if [ -f "pyproject.toml" ]; then
          pip install .
        elif [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        pip install pytest pytest-asyncio httpx requests pydantic
      fi
  script:
    - $[[ inputs.python_test_cmd ]]
