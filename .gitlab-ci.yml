---
stages:
  - format
  - build
  - lint
  - test
  - security
  - review
  - deploy
  - release

include:
  # reviewer_image references the :edge tag image built by this pipeline to support pre-merge self-review.
  - local: templates/core.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    inputs:
      reviewer_image: "registry.gitlab.com/csning1998-lab/gitlab-ci-with-code-reviewer/reviewer:edge"
      review_models:
        - "claude-sonnet-5.5"
        - "claude-opus-5.5"
        - "gemini-3.8-flash"
        - "azure-gpt-5.4-mini"
      enable_sonarqube: true
      sonar_scanner_tags: ["sonarqube-network"]
      sonar_go_coverage_path: "tools/ci/coverage.out"
  - local: templates/lang-go.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    inputs:
      go_globs:
        - "tools/**/*.go"
        - "tools/**/go.mod"
        - "tools/**/go.sum"
        - "templates/lang-go.yml"
        - ".gitlab/golangci.yml"
  - local: templates/iac-terraform.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    inputs:
      checkov_skip: "CKV_GIT_1,CKV_GLB_1,CKV_GLB_3,CKV_GLB_4,CKV_TF_1"
  - local: templates/auto-tag.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    inputs:
      reviewer_image: "$CI_REGISTRY_IMAGE/reviewer:edge"
      stage: release
  - local: .gitlab/ci/modules-terraform.yml
  - local: .gitlab/ci/verify-jvm.yml
  - local: .gitlab/ci/verify-c-cpp.yml
  - local: .gitlab/ci/verify-csharp.yml
  - local: .gitlab/ci/verify-rust.yml

# Merge request events publish to the :edge container tag, whereas semver git tags produce versioned release images.
build:reviewer-image:
  stage: build
  image: quay.io/buildah/stable:v1.43.0
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  variables:
    STORAGE_DRIVER: vfs
    IMAGE: "$CI_REGISTRY_IMAGE/reviewer"
  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah build --build-arg CI_JOB_TOKEN="${CI_JOB_TOKEN}" -t "$IMAGE:build" -f tools/ci/Dockerfile tools/ci
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        buildah tag "$IMAGE:build" "$IMAGE:$CI_COMMIT_TAG"
        buildah push "$IMAGE:$CI_COMMIT_TAG"
      else
        buildah tag "$IMAGE:build" "$IMAGE:edge"
        buildah push "$IMAGE:edge"
      fi

security:trivy-image:
  stage: security
  image:
    name: docker.io/aquasec/trivy:0.72.0
    entrypoint: [""]
  needs:
    - job: build:reviewer-image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="edge"
      fi
    - trivy image --exit-code 1 --severity CRITICAL,HIGH "$CI_REGISTRY_IMAGE/reviewer:$IMAGE_TAG"

publish-catalog:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - job: build:reviewer-image
    - job: security:trivy-image
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "Publishing templates/ components for $CI_COMMIT_TAG to the CI/CD Catalog."
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "CI template release $CI_COMMIT_TAG"
