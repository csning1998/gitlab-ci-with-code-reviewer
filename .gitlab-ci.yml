---
stages:
  - format
  - build
  - lint
  - security
  - review
  - release

include:
  # reviewer_image references the :edge tag image built by this pipeline to support pre-merge self-review.
  - local: templates/core.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    inputs:
      reviewer_image: "registry.gitlab.com/csning1998/gitlab-ci-with-code-reviewer/reviewer:edge"
      claude_model: "claude-sonnet-5"
      gemini_model: "gemini-3.6-flash" # or `gemma-4-31b-it`
      enable_sonarqube: true
      sonar_scanner_tags: ["sonarqube-network"]
      sonar_go_coverage_path: "tools/ci/coverage.out"
  - local: templates/lang-go.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - local: templates/iac-terraform.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Merge request events publish to the :edge container tag, whereas semver git tags produce versioned release images.
build-reviewer-image:
  stage: build
  image: quay.io/buildah/stable:v1.43.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_TAG"
  variables:
    STORAGE_DRIVER: vfs
    IMAGE: "$CI_REGISTRY_IMAGE/reviewer"
  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah build -t "$IMAGE:build" -f tools/ci/Dockerfile tools/ci
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        buildah tag "$IMAGE:build" "$IMAGE:$CI_COMMIT_TAG"
        buildah push "$IMAGE:$CI_COMMIT_TAG"
      else
        buildah tag "$IMAGE:build" "$IMAGE:edge"
        buildah push "$IMAGE:edge"
      fi

trivy-image-scan:
  stage: security
  image:
    name: docker.io/aquasec/trivy:0.72.0
    entrypoint: [""]
  needs:
    - job: build-reviewer-image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_TAG"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="edge"
      fi
    - trivy image --exit-code 1 --severity CRITICAL,HIGH "$CI_REGISTRY_IMAGE/reviewer:$IMAGE_TAG"

publish-catalog:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - job: build-reviewer-image
    - job: trivy-image-scan
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - echo "Publishing templates/ components for $CI_COMMIT_TAG to the CI/CD Catalog."
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "CI template release $CI_COMMIT_TAG"

# Automatically calculates and pushes a new Semantic Version tag derived from Conventional Commit
# headers on squash-merge commits. Replaces manual tagging procedures, eliminating tag detachment
# caused by commit hash reassignments during GitLab squash-and-merge operations.
auto-tag:
  stage: release
  image: "$CI_REGISTRY_IMAGE/reviewer:edge"
  needs:
    - job: build-reviewer-image
    - job: trivy-image-scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if ! LATEST_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_SHA}^" 2>/tmp/describe-error.log); then
        echo "WARNING: git describe failed against ${CI_COMMIT_SHA}^, defaulting to 0.0.0. Reason:"
        cat /tmp/describe-error.log
        LATEST_TAG="0.0.0"
      fi
      SUBJECT=$(git log -1 --format=%s "$CI_COMMIT_SHA")
      RESULT=$(mr-semver-resolver --latest "$LATEST_TAG" --subject "$SUBJECT")

      if [ "$RESULT" = "NONE" ]; then
        echo "Commit subject '${SUBJECT}' does not trigger a release. Skipping."
        exit 0
      fi

      echo "Bumping ${LATEST_TAG} to ${RESULT} for ${CI_COMMIT_SHA}."
      git tag "$RESULT" "$CI_COMMIT_SHA"
      git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$RESULT"
